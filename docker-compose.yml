services:
  db:
    image: postgres:14-alpine
    container_name: endo-care-db
    environment:
      POSTGRES_DB: websited
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Expose db port to host for easier debugging
    networks:
      - endo-care-net

  backend:
    build:
      context: ./backend
    container_name: endo-care-backend
    ports:
      - "8081:8080"
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/websited
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    networks:
      - endo-care-net

  frontend:
    build:
      context: ./frontend
    container_name: endo-care-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - endo-care-net

networks:
  endo-care-net:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
