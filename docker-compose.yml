services:
  db:
    image: postgres:14-alpine
    container_name: endo-care-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-websited}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # Secure: accessible only from localhost
    networks:
      - endo-care-net

  backend:
    build:
      context: ./backend
    container_name: endo-care-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080" # Secure: accessible locally or via Nginx
      - "127.0.0.1:8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-websited}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Elbekendo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Elbek1990}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      - db
    networks:
      - endo-care-net

  frontend:
    build:
      context: ./frontend
    container_name: endo-care-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - endo-care-net

networks:
  endo-care-net:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
