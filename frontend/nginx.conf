server {
    listen 80;
    server_name localhost;

    # Root directory for the React app
    root /usr/share/nginx/html;
    index index.html;

    # Handle API requests by proxying them to the backend service
    # The name 'backend' will be resolved by Docker Compose
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Uploads requests to the Spring Boot backend
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow larger file uploads for videos
        client_max_body_size 500M;
    }

    # Handle all other requests by serving the React app
    # This ensures that client-side routing works correctly
    location / {
        try_files $uri $uri/ /index.html;
    }
}
