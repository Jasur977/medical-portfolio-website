services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: endocare-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: endocare-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: Elbekendo
      - key: ADMIN_PASSWORD
        value: Elbek1990
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

  # 2. React + Vite Frontend (Free Static Site with CDN)
  - type: web
    name: endocare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: endocare-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. Managed PostgreSQL Database
  - name: endocare-db
    databaseName: websited
    user: endocare
    plan: free
    region: frankfurt
