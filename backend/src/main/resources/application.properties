spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/websited}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Limits (Images, Videos, Scans)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Reverse Proxy Forwarded Headers (for Nginx)
server.forward-headers-strategy=framework

# JWT Secret Key (In production, use a secure, randomly generated 256-bit key)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Default Admin Credentials
admin.username=${ADMIN_USERNAME:Elbekendo}
admin.password=${ADMIN_PASSWORD:Elbek1990}
